<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Muse</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="menu.css">
    <script src="menu.js" defer></script>
</head>

<body>

    <div id="background">
        <div id="mainWrapper">
            <div class="wrapper" id="springWrapper"><img src="../assets/indexSpring2.png" alt=""></div>
            <div class="wrapper" id="summerWrapper"><img src="../assets/indexSummer1.png" alt=""></div>
            <div class="wrapper" id="autumnWrapper"><img src="../assets/indexAutumn1.png" alt=""></div>
            <div class="wrapper" id="winterWrapper"><img src="../assets/indexWinter1.png" alt=""></div>
            <div class="wrapper" id="finalWrapper"><img src="../assets/indexFinal1.png" alt=""></div>
        </div>
    </div>
    <div class="menu-wrapper">
        <img src="../assets/menu-begin.PNG" class="menu" id="menuBegin">
        <img src="../assets/menu-down.PNG" class="menu" id="menuDown">
        <img src="../assets/menu-up.PNG" class="menu" id="menuUp">
        <img src="../assets/menu.PNG" class="menu" id="menuMain">
    </div>
</body>

</html>
